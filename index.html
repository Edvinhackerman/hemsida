<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDVIN // EXPERIENCE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020204;
    font-family: 'Orbitron', sans-serif;
    color: white;
}

body {
    cursor: crosshair;
}

/* BACKGROUND */
.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(255,0,50,.16), transparent 25%),
        radial-gradient(circle at 20% 80%, rgba(100,0,255,.12), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(255,0,0,.08), transparent 30%),
        #020204;
}

/* GRID */
.grid {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image:
        linear-gradient(rgba(255,0,50,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,50,.08) 1px, transparent 1px);
    background-size: 55px 55px;
    transform: perspective(500px) rotateX(60deg);
    animation: gridMove 8s linear infinite;
    mask-image: linear-gradient(to top, black, transparent 75%);
}

@keyframes gridMove {
    from { transform: perspective(500px) rotateX(60deg) translateY(0); }
    to   { transform: perspective(500px) rotateX(60deg) translateY(55px); }
}

/* GLOW ORBS */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    animation: float 8s ease-in-out infinite;
}

.orb.one {
    width: 300px;
    height: 300px;
    background: #ff003c;
    top: -100px;
    left: -100px;
}

.orb.two {
    width: 250px;
    height: 250px;
    background: #6d00ff;
    right: -80px;
    bottom: -80px;
    animation-delay: -4s;
}

@keyframes float {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(40px,-30px); }
}

/* PARTICLES */
#particles {
    position: absolute;
    inset: 0;
}

/* SCANLINES */
.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.018) 0px,
        rgba(255,255,255,.018) 1px,
        transparent 2px,
        transparent 4px
    );
}

/* VIGNETTE */
.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 19;
    box-shadow: inset 0 0 180px 60px #000;
}

/* CONTENT */
.container {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.content {
    max-width: 900px;
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
}

/* SMALL LABEL */
.status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    margin-bottom: 28px;

    border: 1px solid rgba(255,0,60,.5);
    border-radius: 100px;

    background: rgba(255,0,50,.05);
    box-shadow:
        0 0 20px rgba(255,0,50,.15),
        inset 0 0 20px rgba(255,0,50,.05);

    color: #ff4d70;
    font-size: 11px;
    letter-spacing: 4px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff174d;
    box-shadow: 0 0 12px #ff174d;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

/* TITLE */
h1 {
    position: relative;
    font-size: clamp(55px, 11vw, 145px);
    font-weight: 900;
    letter-spacing: -5px;
    line-height: .85;

    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 30px rgba(255,0,50,.7),
        0 0 70px rgba(255,0,50,.45);

    animation: titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow {
    0%,100% {
        text-shadow:
            0 0 10px rgba(255,255,255,.7),
            0 0 30px rgba(255,0,50,.7),
            0 0 70px rgba(255,0,50,.45);
    }

    50% {
        text-shadow:
            0 0 15px white,
            0 0 45px rgba(255,0,50,.9),
            0 0 100px rgba(255,0,50,.65);
    }
}

.subtitle {
    margin-top: 25px;
    color: rgba(255,255,255,.55);
    font-size: 12px;
    letter-spacing: 7px;
}

/* BUTTON */
.button-wrapper {
    margin-top: 55px;
    display: flex;
    justify-content: center;
}

.youtube {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;

    padding: 21px 35px;

    color: white;
    text-decoration: none;

    border: 1px solid #ff174d;
    border-radius: 4px;

    background: linear-gradient(
        135deg,
        rgba(255,0,50,.18),
        rgba(255,0,50,.04)
    );

    box-shadow:
        0 0 15px rgba(255,0,50,.35),
        inset 0 0 15px rgba(255,0,50,.08);

    overflow: hidden;

    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;

    transition: all .3s ease;
}

.youtube::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );

    transform: skewX(-20deg);
    transition: .6s;
}

.youtube:hover::before {
    left: 140%;
}

.youtube:hover {
    transform: translateY(-5px) scale(1.04);

    background: #ff174d;

    box-shadow:
        0 0 20px #ff174d,
        0 0 60px rgba(255,23,77,.7),
        0 0 120px rgba(255,23,77,.3);
}

.play {
    width: 0;
    height: 0;

    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 13px solid white;

    filter: drop-shadow(0 0 5px white);
}

/* CORNER UI */
.corner {
    position: fixed;
    z-index: 15;
    color: rgba(255,255,255,.3);
    font-size: 9px;
    letter-spacing: 2px;
}

.top-left {
    top: 25px;
    left: 30px;
}

.top-right {
    top: 25px;
    right: 30px;
}

.bottom-left {
    bottom: 25px;
    left: 30px;
}

.bottom-right {
    bottom: 25px;
    right: 30px;
}

/* LOADING BAR */
.bar {
    width: 180px;
    height: 2px;
    background: rgba(255,255,255,.1);
    margin: 45px auto 0;
    overflow: hidden;
}

.bar span {
    display: block;
    height: 100%;
    width: 40%;
    background: #ff174d;
    box-shadow: 0 0 10px #ff174d;
    animation: loading 2s ease-in-out infinite;
}

@keyframes loading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
}

/* MOBILE */
@media(max-width:600px) {

    h1 {
        letter-spacing: -3px;
    }

    .subtitle {
        font-size: 8px;
        letter-spacing: 4px;
    }

    .youtube {
        padding: 18px 25px;
        font-size: 11px;
    }

    .corner {
        font-size: 7px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <canvas id="particles"></canvas>
</div>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="corner top-left">SYSTEM // ONLINE</div>
<div class="corner top-right">EDVIN.HACKERMAN</div>
<div class="corner bottom-left">ACCESS_GRANTED</div>
<div class="corner bottom-right">2026 // 001</div>

<main class="container">

    <div class="content" id="content">

        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

        <h1>EDVIN</h1>

        <div class="subtitle">
            ENTER THE EXPERIENCE
        </div>

        <div class="button-wrapper">
            <a
                class="youtube"
                href="https://www.youtube.com/watch?v=p8cwqd37yKM"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="play"></span>
                WATCH VIDEO
            </a>
        </div>

        <div class="bar">
            <span></span>
        </div>

    </div>

</main>

<script>

/* PARTICLES */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

for (let i = 0; i < 100; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * .6 + .1,
        opacity: Math.random(),
        direction: Math.random() > .5 ? 1 : -1
    });
}

function animateParticles() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {

        p.y -= p.speed;

        if (p.y < 0) {
            p.y = canvas.height;
            p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,30,70,${p.opacity})`;

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff174d";

        ctx.fill();
    });

    requestAnimationFrame(animateParticles);
}

animateParticles();


/* MOUSE 3D EFFECT */

const content = document.getElementById("content");

document.addEventListener("mousemove", e => {

    const x = (window.innerWidth / 2 - e.clientX) / 40;
    const y = (window.innerHeight / 2 - e.clientY) / 40;

    content.style.transform =
        `rotateY(${-x}deg) rotateX(${y}deg)`;
});


/* CLICK FLASH */

document.addEventListener("click", () => {

    const flash = document.createElement("div");

    flash.style.position = "fixed";
    flash.style.inset = "0";
    flash.style.background = "#ff174d";
    flash.style.opacity = "0.15";
    flash.style.pointerEvents = "none";
    flash.style.zIndex = "999";

    document.body.appendChild(flash);

    flash.animate(
        [
            { opacity: .15 },
            { opacity: 0 }
        ],
        {
            duration: 350,
            easing: "ease-out"
        }
    );

    setTimeout(() => flash.remove(), 400);
});

</script>

</body>
</html>
