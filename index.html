<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020a12">
<title>BADVLOGG // ÖSTERGÖTLAND</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
:root{
  --bg:#020a12;
  --panel:#061018;
  --panel2:#0a1620;
  --red:#ff1838;
  --red2:#ff4a58;
  --red-dark:#8e0018;
  --cyan:#3dd6ff;
  --cyan2:#7aecff;
  --aqua:#1a8fbf;
  --deep:#031018;
  --white:#f0f7fb;
  --muted:#7a93a5;
  --line:rgba(61,214,255,.22);
  --line-soft:rgba(255,255,255,.08);
  --glow:0 0 28px rgba(61,214,255,.25);
  --glow-red:0 0 28px rgba(255,24,56,.22);
  --radius:22px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"DM Sans",sans-serif;
  color:var(--white);
  background:
    radial-gradient(ellipse at 20% 0%,rgba(61,214,255,.12),transparent 35%),
    radial-gradient(ellipse at 85% 20%,rgba(26,143,191,.1),transparent 40%),
    radial-gradient(ellipse at 50% 100%,rgba(255,24,56,.06),transparent 45%),
    linear-gradient(180deg,#020a12 0%,#031820 40%,#020e16 100%);
  min-height:100vh;
  overflow-x:hidden;
}

/* Underwater caustic / light rays */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9998;
  opacity:.04;
  background:
    repeating-linear-gradient(
      -12deg,
      transparent 0px,
      rgba(122,236,255,.9) 1px,
      transparent 2px,
      transparent 28px
    );
  mix-blend-mode:screen;
  animation:causticShift 18s linear infinite;
}
@keyframes causticShift{
  to{background-position:120px 80px}
}

/* Soft scanlines */
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  opacity:.03;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.7) 0px,
    rgba(255,255,255,.7) 1px,
    transparent 1px,
    transparent 4px
  );
  mix-blend-mode:screen;
}

#particles{
  position:fixed;
  inset:0;
  z-index:-3;
  overflow:hidden;
  pointer-events:none;
}
.particle{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff,var(--cyan2) 40%,transparent 70%);
  opacity:.4;
  animation:bubbleRise linear infinite;
  box-shadow:0 0 8px rgba(61,214,255,.5);
}
@keyframes bubbleRise{
  from{transform:translate3d(0,20px,0) scale(.6);opacity:0}
  12%{opacity:.55}
  80%{opacity:.25}
  to{transform:translate3d(var(--dx),-115vh,0) scale(1.1);opacity:0}
}

/* Wave layers at bottom */
.wave-wrap{
  position:fixed;
  left:0;right:0;bottom:0;
  height:180px;
  z-index:-1;
  pointer-events:none;
  overflow:hidden;
}
.wave{
  position:absolute;
  left:-5%;
  width:110%;
  height:100%;
  opacity:.35;
}
.wave path{fill:rgba(61,214,255,.08)}
.wave.w2{opacity:.25;animation:waveMove 9s ease-in-out infinite alternate}
.wave.w3{opacity:.18;animation:waveMove 13s ease-in-out infinite alternate-reverse}
.wave.w1{animation:waveMove 7s ease-in-out infinite alternate}
@keyframes waveMove{
  from{transform:translateX(0)}
  to{transform:translateX(-40px)}
}

.grid-bg{
  position:fixed;
  inset:auto -20% 0;
  height:50vh;
  z-index:-2;
  pointer-events:none;
  background:
    linear-gradient(rgba(61,214,255,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(61,214,255,.09) 1px,transparent 1px);
  background-size:42px 42px;
  transform:perspective(450px) rotateX(62deg) translateY(35%);
  transform-origin:center bottom;
  mask-image:linear-gradient(to top,rgba(0,0,0,.7),transparent);
  animation:gridMove 14s linear infinite;
}
@keyframes gridMove{
  to{background-position:0 42px,42px 0}
}

a{color:inherit}
button,input,select{font:inherit}

.topline{
  height:3px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--red),var(--cyan),transparent);
  box-shadow:0 0 25px var(--cyan);
}

.hero{
  min-height:690px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 72% 25%,rgba(61,214,255,.16),transparent 26%),
    radial-gradient(circle at 18% 75%,rgba(26,143,191,.12),transparent 32%),
    radial-gradient(circle at 50% 100%,rgba(255,24,56,.07),transparent 40%),
    linear-gradient(160deg,#020a12,#041420 50%,#061828);
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 49.8%,rgba(61,214,255,.1) 50%,transparent 50.2%),
    linear-gradient(transparent 49.8%,rgba(61,214,255,.06) 50%,transparent 50.2%);
  background-size:100px 100px;
  mask-image:radial-gradient(circle at center,#000,transparent 75%);
  opacity:.7;
}
.hero:after{
  content:"";
  position:absolute;
  width:520px;height:520px;
  right:-180px;top:50px;
  border:1px solid rgba(61,214,255,.25);
  border-radius:50%;
  box-shadow:
    0 0 0 45px rgba(61,214,255,.03),
    0 0 0 90px rgba(61,214,255,.02),
    0 0 90px rgba(61,214,255,.15);
  animation:pulseRing 5s ease-in-out infinite;
}
@keyframes pulseRing{
  50%{transform:scale(1.05);opacity:.7}
}

nav{
  position:absolute;
  top:0;left:0;right:0;
  z-index:20;
  padding:25px 0;
}
.nav{
  width:min(1240px,92%);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font:800 13px/1 Orbitron,sans-serif;
  letter-spacing:2px;
}
.logo span{color:var(--cyan)}
.nav-links{display:flex;gap:9px}
.nav-btn{
  text-decoration:none;
  padding:11px 15px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(0,20,30,.4);
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
  transition:.2s;
}
.nav-btn:hover{
  border-color:var(--cyan);
  box-shadow:var(--glow);
  transform:translateY(-2px);
  color:var(--cyan2);
}

.hero-inner{
  width:min(1240px,92%);
  margin:auto;
  position:relative;
  z-index:3;
  padding:120px 0 110px;
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:10px;
  font:700 11px/1 Orbitron,sans-serif;
  letter-spacing:3px;
  color:#8aabb8;
  text-transform:uppercase;
}
.eyebrow:before{
  content:"";
  width:34px;height:2px;
  background:linear-gradient(90deg,var(--cyan),var(--red));
  box-shadow:0 0 12px var(--cyan);
}
h1{
  font:900 clamp(58px,11vw,145px)/.82 Orbitron,sans-serif;
  letter-spacing:-8px;
  margin:25px 0 28px;
  max-width:1050px;
  text-transform:uppercase;
  text-shadow:
    0 0 18px rgba(61,214,255,.2),
    0 0 60px rgba(61,214,255,.08);
}
h1 .red{
  color:var(--cyan);
  text-shadow:0 0 24px rgba(61,214,255,.5),0 0 80px rgba(61,214,255,.2);
  background:linear-gradient(135deg,var(--cyan2),var(--cyan),#1a8fbf);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero-copy{
  max-width:690px;
  color:#9bb4c4;
  font-size:17px;
  line-height:1.75;
}
.badges{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:32px;
}
.badge{
  padding:11px 14px;
  border:1px solid rgba(61,214,255,.15);
  border-radius:12px;
  background:rgba(61,214,255,.05);
  color:#c8dce8;
  font-size:11px;
  font-weight:800;
  letter-spacing:.4px;
  backdrop-filter:blur(12px);
}
.badge strong{color:var(--cyan2)}

.hero-stat{
  position:absolute;
  right:3%;
  bottom:90px;
  width:190px;
  padding:18px;
  border:1px solid rgba(61,214,255,.3);
  background:rgba(4,16,24,.75);
  backdrop-filter:blur(15px);
  box-shadow:var(--glow);
  transform:rotate(-3deg);
}
.hero-stat small{
  color:#6a8a9a;
  font:700 9px Orbitron,sans-serif;
  letter-spacing:1.5px;
}
.hero-stat b{
  display:block;
  margin-top:7px;
  font:800 30px Orbitron,sans-serif;
  color:var(--cyan2);
}

main{
  width:min(1240px,92%);
  margin:-65px auto 80px;
  position:relative;
  z-index:5;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}
.stat{
  padding:18px 20px;
  border:1px solid rgba(61,214,255,.12);
  border-radius:16px;
  background:linear-gradient(145deg,rgba(8,24,36,.95),rgba(4,14,22,.96));
  box-shadow:0 15px 45px rgba(0,0,0,.3);
  position:relative;
  overflow:hidden;
}
.stat:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(var(--cyan),var(--aqua));
  box-shadow:0 0 15px var(--cyan);
}
.stat-label{
  color:#6a8898;
  font:700 9px Orbitron,sans-serif;
  letter-spacing:1.5px;
}
.stat-value{
  margin-top:7px;
  font:800 25px Orbitron,sans-serif;
}
.stat-value.red{color:var(--cyan2)}

.app{
  border:1px solid rgba(61,214,255,.22);
  border-radius:24px;
  background:rgba(4,16,26,.9);
  box-shadow:0 30px 100px rgba(0,0,0,.5),0 0 40px rgba(61,214,255,.08);
  overflow:hidden;
  backdrop-filter:blur(18px);
}

.toolbar{
  padding:17px;
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  border-bottom:1px solid rgba(61,214,255,.1);
  background:linear-gradient(90deg,rgba(61,214,255,.06),transparent 60%);
}
.search-wrap{position:relative}
.search-icon{
  position:absolute;
  left:15px;top:50%;
  transform:translateY(-50%);
  color:var(--cyan);
  font-size:14px;
}
.search{
  width:100%;
  padding:14px 16px 14px 42px;
  border:1px solid rgba(61,214,255,.12);
  border-radius:12px;
  outline:none;
  background:#061018;
  color:#fff;
}
.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(61,214,255,.1)}
select,.tool-btn{
  padding:14px 15px;
  border:1px solid rgba(61,214,255,.12);
  border-radius:12px;
  background:#061018;
  color:#e0eef5;
  outline:none;
}
.tool-btn{
  cursor:pointer;
  font-weight:800;
  font-size:11px;
  transition:.2s;
}
.tool-btn:hover{border-color:var(--cyan);color:#fff;box-shadow:var(--glow)}

.content{
  display:grid;
  grid-template-columns:430px 1fr;
  min-height:720px;
}
.list{
  padding:18px;
  max-height:720px;
  overflow:auto;
  border-right:1px solid rgba(61,214,255,.1);
}
.list::-webkit-scrollbar{width:5px}
.list::-webkit-scrollbar-thumb{background:#0a4058;border-radius:10px}
.list-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 2px 14px;
}
.count{
  font:800 11px Orbitron,sans-serif;
  letter-spacing:1px;
}
.count span{color:var(--cyan2)}
.sort-info{font-size:10px;color:#5a7a8a}

.cards{display:flex;flex-direction:column;gap:10px}
.card{
  position:relative;
  padding:17px;
  border:1px solid rgba(61,214,255,.1);
  border-radius:17px;
  background:linear-gradient(145deg,#0a1a26,#061018);
  cursor:pointer;
  transition:.22s ease;
  overflow:hidden;
}
.card:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(var(--cyan),#0a4a68);
  opacity:.75;
}
.card:hover{
  transform:translateX(4px);
  border-color:rgba(61,214,255,.4);
  box-shadow:0 0 28px rgba(61,214,255,.1);
}
.card.active{
  border-color:var(--cyan);
  box-shadow:0 0 28px rgba(61,214,255,.16);
}
.card-top{display:flex;justify-content:space-between;gap:12px}
.card h3{font-size:15px;line-height:1.25}
.place{color:#6a8898;font-size:10px;margin-top:4px}
.stars{
  white-space:nowrap;
  color:#ffba22;
  font-size:15px;
  letter-spacing:-2px;
  filter:drop-shadow(0 0 5px rgba(255,186,34,.2));
}
.score{
  text-align:right;
  margin-top:3px;
  color:#6a8898;
  font:700 8px Orbitron,sans-serif;
}

/* Review preview box on cards */
.review-preview{
  margin-top:11px;
  padding:11px 13px;
  border-radius:12px;
  border:1px solid rgba(61,214,255,.12);
  background:rgba(61,214,255,.04);
  font-size:12px;
  line-height:1.55;
  color:#9bb4c4;
}
.review-preview.empty-prev{
  border-style:dashed;
  border-color:rgba(255,255,255,.08);
  background:rgba(255,255,255,.02);
  color:#5a7a8a;
  font-size:11px;
}
.review-preview strong{
  display:block;
  color:var(--cyan2);
  font:800 8px Orbitron,sans-serif;
  letter-spacing:1px;
  margin-bottom:5px;
}

.precision{
  display:inline-flex;
  margin-top:10px;
  padding:5px 8px;
  border-radius:999px;
  border:1px solid rgba(61,214,255,.2);
  background:rgba(61,214,255,.06);
  color:var(--cyan2);
  font:700 8px Orbitron,sans-serif;
  letter-spacing:.5px;
}
.precision.maps{
  color:#6a8898;
  border-color:rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
}
.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.action{
  display:inline-flex;
  align-items:center;
  gap:5px;
  text-decoration:none;
  border:1px solid rgba(61,214,255,.28);
  color:var(--cyan2);
  background:rgba(61,214,255,.06);
  padding:8px 10px;
  border-radius:9px;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}
.action:hover{background:var(--cyan);color:#021018;box-shadow:0 0 18px rgba(61,214,255,.35)}
.action.secondary{color:#8aabb8;border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.025)}

.map-panel{
  min-width:0;
  position:relative;
  padding:12px;
  background:#031018;
}
#map{
  width:100%;
  height:696px;
  border-radius:17px;
  border:1px solid rgba(61,214,255,.22);
  overflow:hidden;
  background:#031018;
}
.map-overlay{
  position:absolute;
  top:25px;left:25px;
  z-index:500;
  pointer-events:none;
}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 11px;
  border:1px solid rgba(61,214,255,.3);
  border-radius:999px;
  background:rgba(3,16,24,.85);
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(61,214,255,.12);
  font:800 8px Orbitron,sans-serif;
  letter-spacing:1px;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
  animation:blink 1.4s infinite;
}
@keyframes blink{50%{opacity:.35;transform:scale(.75)}}

.leaflet-container{font-family:"DM Sans",sans-serif;background:#031018}
.leaflet-control-zoom a{
  background:#061018!important;
  color:var(--cyan)!important;
  border-color:rgba(61,214,255,.25)!important;
}
.leaflet-control-attribution{
  background:rgba(0,0,0,.7)!important;
  color:#5a7a8a!important;
}
.leaflet-control-attribution a{color:#8aabb8!important}

.pin-icon{
  width:40px;height:40px;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  background:radial-gradient(circle at 35% 30%,#7aecff,var(--cyan) 45%,#0a5a80);
  border:2px solid #fff;
  box-shadow:0 0 17px rgba(61,214,255,.7),0 7px 22px rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
}
.pin-icon b{
  transform:rotate(45deg);
  color:#021018;
  font:900 9px Orbitron,sans-serif;
}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{
  background:rgba(61,214,255,.15)!important;
}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
  background:linear-gradient(135deg,var(--cyan),#0a5a80)!important;
  color:#021018!important;
  font:900 11px Orbitron,sans-serif;
  box-shadow:0 0 25px rgba(61,214,255,.45);
}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  background:#061018;
  color:#e0eef5;
  border:1px solid rgba(61,214,255,.25);
}
.leaflet-popup-content-wrapper{box-shadow:0 15px 50px rgba(0,0,0,.55)}
.popup-kicker{
  color:var(--cyan);
  font:800 8px Orbitron,sans-serif;
  letter-spacing:1.5px;
  margin-bottom:6px;
}
.popup-title{font-size:17px;font-weight:800}
.popup-city{font-size:10px;color:#6a8898}
.popup-score{margin:8px 0;color:#ffba22}
.popup-link{color:var(--cyan2);font-size:11px;font-weight:800;text-decoration:none}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:14px;
}
.info-card{
  padding:21px;
  border:1px solid rgba(61,214,255,.1);
  border-radius:18px;
  background:rgba(6,20,30,.85);
}
.info-card b{
  font:800 10px Orbitron,sans-serif;
  letter-spacing:1px;
}
.info-card b span{color:var(--cyan)}
.info-card p{
  color:#6a8898;
  font-size:11px;
  line-height:1.7;
  margin-top:8px;
}

.empty{
  padding:40px 15px;
  text-align:center;
  color:#5a7a8a;
}
.empty b{display:block;color:#8aabb8;margin-bottom:6px}

footer{
  padding:45px 20px 65px;
  text-align:center;
  color:#4a6a7a;
  font:700 9px Orbitron,sans-serif;
  letter-spacing:1.5px;
}
footer span{color:var(--cyan)}

@media(max-width:1050px){
  .content{grid-template-columns:360px 1fr}
  .dashboard{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  .hero{min-height:650px}
  .hero-stat{display:none}
  .nav-links .nav-btn:first-child{display:none}
  .toolbar{grid-template-columns:1fr 1fr}
  .search-wrap{grid-column:1/-1}
  .content{grid-template-columns:1fr}
  .list{max-height:none;border-right:0;border-bottom:1px solid rgba(61,214,255,.1)}
  #map{height:530px}
  .map-panel{order:-1}
  .info-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav{width:90%}
  .logo{font-size:10px}
  .hero-inner{width:90%;padding-top:115px}
  h1{font-size:52px;letter-spacing:-4px}
  .hero-copy{font-size:14px}
  main{width:94%;margin-top:-35px}
  .dashboard{gap:7px}
  .stat{padding:14px}
  .stat-value{font-size:18px}
  .stat-label{font-size:7px}
  .toolbar{grid-template-columns:1fr}
  .search-wrap{grid-column:auto}
  #map{height:470px}
  .map-overlay{top:20px;left:20px}
}

/* === PLACE DETAIL / REVIEW PANEL === */
.detail-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(1,8,14,.82);
  backdrop-filter:blur(16px);
}
.detail-backdrop.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.detail-panel{
  width:min(900px,100%);
  max-height:min(820px,92vh);
  overflow:auto;
  position:relative;
  border:1px solid rgba(61,214,255,.35);
  border-radius:28px;
  background:
    radial-gradient(circle at 85% 8%,rgba(61,214,255,.14),transparent 30%),

.detail-panel::-webkit-scrollbar{width:6px}
.detail-panel::-webkit-scrollbar-thumb{background:#0a4058;border-radius:10px}

.detail-close{
  position:absolute;
  top:18px;right:18px;
  z-index:4;
  width:40px;height:40px;
  border:1px solid rgba(61,214,255,.2);
  border-radius:50%;
  background:rgba(0,15,25,.5);
  color:#fff;
  cursor:pointer;
  font-size:20px;
}
.detail-close:hover{
  border-color:var(--cyan);

  box-shadow:0 0 20px rgba(61,214,255,.25);
}

.detail-top{

.detail-kicker{
  color:var(--cyan);

}
.detail-title{

  padding-right:45px;
  font:800 clamp(30px,5vw,54px)/1 Orbitron,sans-serif;
  letter-spacing:-2px;
}
.detail-location{
  color:#6a8898;
  font-size:13px;
  margin-top:9px;
}
.detail-score-row{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin-top:22px;
}
.detail-stars{
  color:#ffba22;

  letter-spacing:-3px;

.detail-score{

.detail-grid{

  padding:22px 42px;
}
.detail-box{

  padding:20px;
  background:rgba(61,214,255,.03);
}
.detail-box.full{grid-column:1/-1}
.detail-box.review-box{
  border-color:rgba(61,214,255,.25);
  background:

  position:relative;
  overflow:hidden;
}
.detail-box.review-box:before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,var(--cyan),var(--aqua),transparent);
}
.detail-label{
  color:#5a7a8a;
  font:800 8px Orbitron,sans-serif;
  letter-spacing:1.5px;
  margin-bottom:10px;
}
.detail-text{
  color:#a8c0d0;
  font-size:13px;
  line-height:1.75;
}
.review-empty{
  color:#5a7a8a;
  font-size:13px;
  line-height:1.7;
}
.review-empty strong{
  display:block;
  color:#8aabb8;
  margin-bottom:5px;
}
.review-note{
  border-left:3px solid var(--cyan);
  padding:14px 16px;
  background:rgba(61,214,255,.06);
  color:#c8dce8;
  line-height:1.8;
  font-size:14px;
  border-radius:0 12px 12px 0;
}

.detail-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  padding:0 42px 34px;
}
.detail-action{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:44px;
  padding:0 15px;
  border:1px solid rgba(61,214,255,.3);
  border-radius:11px;
  background:rgba(61,214,255,.08);
  color:var(--cyan2);
  text-decoration:none;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
.detail-action:hover{
  background:var(--cyan);
  color:#021018;
  box-shadow:0 0 25px rgba(61,214,255,.35);
}
.detail-action.secondary{
  border-color:rgba(255,255,255,.1);
  color:#8aabb8;
  background:rgba(255,255,255,.025);
}
.detail-status{
  display:inline-flex;
  align-items:center;
  padding:7px 10px;
  border:1px solid rgba(61,214,255,.25);
  border-radius:999px;
  color:var(--cyan2);
  background:rgba(61,214,255,.06);
  font:800 8px Orbitron,sans-serif;
  letter-spacing:.6px;
}
.detail-status.gray{
  color:#6a8898;
  border-color:rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
}

@media(max-width:650px){
  .detail-backdrop{padding:10px}
  .detail-top{padding:30px 22px 24px}
  .detail-title{font-size:30px}
  .detail-grid{grid-template-columns:1fr;padding:16px 22px}
  .detail-box.full{grid-column:auto}
  .detail-actions{padding:0 22px 25px}
  .detail-stars{font-size:22px}
}

</style>
</head>
